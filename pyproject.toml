[project]
name = "system-one-control-bench"
version = "0.1.0"
description = "Can a bounded decision model steer an agent across a small grid?"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "typer>=0.12",
    "typesafe-sdk>=0.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The decision models that run on this machine: uv sync --extra local
local = [
    "laya>=0.3.20",
    "gliclass>=0.1.20",
    "torch>=2.7",
]

# PyPI's Windows build of PyTorch runs on the CPU alone; this one also runs on NVIDIA GPUs
# (CUDA 13.0, which needs an NVIDIA driver from 580 on). PyPI's Linux build has CUDA already.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
socb = "system_one_control.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_one_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "PTH", "RET", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# The local extra, which is optional and has no type information.
module = ["laya", "gliclass", "torch", "transformers"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Partly typed, in a way that mypy's strict mode rejects in ordinary use; treated as untyped.
module = ["transformers", "transformers.*"]
follow_imports = "skip"
