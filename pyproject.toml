[project]
name = "system-one-control-bench"
version = "0.0.1"
description = "Bounded decisions in sequential control: separating representation, selection, and replanning."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "minigrid==3.1.0",
    "gymnasium==1.3.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Model adapters. The benchmark's symbolic half runs without any of these.
models = ["typesafe-sdk>=0.1", "python-dotenv>=1.0"]

[project.scripts]
socb = "system_one_control.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_one_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: exhaustive cross-checks against the real environment",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The specification lives in README.md and is quoted verbatim from upstream
# docs; it is prose, not code this project owns.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["minigrid.*", "gymnasium.*"]
ignore_missing_imports = true
