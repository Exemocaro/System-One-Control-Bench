# Level A0: free, offline baselines only. No paid adapters yet.
experiment_id: v0_symbolic
seed: 42

environments:
  - MiniGrid-DoorKey-6x6-v0
  - MiniGrid-Empty-Random-6x6-v0

agents: [random, greedy, rollout_heuristic, oracle]

dataset:
  seeds: 200
  states_per_episode: 3
  max_steps: 100
  split: test
  states_per_environment: 150

candidates:
  max_options: 8
  randomize_display_ids: true

offline:
  horizons: [1, 2]
  description_mode: action_only

online:
  starts_per_environment: 20
  controllers: [reactive]

statistics:
  bootstrap_samples: 2000
  cluster: layout_id
